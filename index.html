<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Әділ & Айгүл</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:wght@100;300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f1eff1;
      font-family: 'Piazzolla', serif;
      overflow-x: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    a {
      display: block;
    }

    .element-animation {
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .element-animation.element-show {
      opacity: 1;
    }

    /* TIMER */
    .timer-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .timer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: 20px 40px;
      justify-items: center;
      align-items: center;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(2px);
      padding: 15px 30px;
      border-radius: 20px;
    }
    .timer-item {
      text-align: center;
    }
    .timer-item .number {
      display: block;
      font-size: 2.8rem;
      font-weight: 300;
      color: #000000;
      letter-spacing: 2px;
      line-height: 1;
    }
    .timer-item .label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #000000;
      margin-top: 2px;
      font-weight: 300;
    }
    .timer-divider {
      font-size: 2rem;
      font-weight: 100;
      color: #000000;
      padding-top: 5px;
    }

    /* FORM */
    .form-wrapper {
      background: #f1eff1;
      padding: 10px 15px 30px;
    }
    .form-container {
      background: transparent;
      padding: 0;
      max-width: 450px;
      margin: 0 auto;
    }
    .form-inner {
      text-align: center;
    }
    .form-inner .title {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 1px;
      color: #000000;
      margin-bottom: 15px;
      text-align: center;
    }
    .form-inner .radio-group {
      text-align: left;
      margin-bottom: 12px;
    }
    .form-inner .radio-group p {
      font-weight: 300;
      margin-bottom: 4px;
      color: #000000;
      font-size: 0.95rem;
    }
    .form-inner .radio-group label {
      font-weight: 300;
      margin-left: 4px;
      color: #000000;
      font-size: 0.9rem;
    }
    .form-inner .radio-group input[type="radio"] {
      margin-right: 2px;
      accent-color: #000000;
      width: 14px;
      height: 14px;
    }
    .form-inner textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #999;
      border-radius: 0;
      padding: 8px 4px 4px;
      font-size: 0.9rem;
      background: transparent;
      resize: vertical;
      min-height: 40px;
      font-family: inherit;
      color: #000000;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-inner textarea:focus {
      border-bottom-color: #000000;
    }
    .form-inner textarea::placeholder {
      color: #888;
      font-weight: 200;
    }
    .btn-submit {
      background: transparent;
      color: #000000;
      border: 1px solid #000000;
      border-radius: 30px;
      padding: 10px 30px;
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 2px;
      width: 100%;
      transition: 0.3s;
      margin-top: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-submit:hover {
      background: #000000;
      color: #ffffff;
    }

    .sakura {
      pointer-events: none;
      position: fixed;
    }

    @media (max-width: 576px) {
      .timer-grid {
        gap: 10px 20px;
        padding: 12px 15px;
      }
      .timer-item .number {
        font-size: 2rem;
      }
      .timer-divider {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

<!-- SAKURA -->

  document.addEventListener('DOMContentLoaded', function() {
    if (typeof Sakura !== 'undefined') {
      new Sakura('body', {
        colors: [
          { gradientColorStart: 'rgba(200,200,200,0.6)', gradientColorEnd: 'rgba(180,180,180,0.4)', gradientColorDegree: 120 },
          { gradientColorStart: 'rgba(180,180,180,0.6)', gradientColorEnd: 'rgba(160,160,160,0.4)', gradientColorDegree: 120 },
          { gradientColorStart: 'rgba(220,220,220,0.6)', gradientColorEnd: 'rgba(190,190,190,0.4)', gradientColorDegree: 120 }
        ],
        delay: 60,
        fallSpeed: 1.2,
        minSize: 8,
        maxSize: 12
      });
    }
  });
</script>

<!-- AUDIO - Музыканы дұрыс ойнату үшін -->
<audio id="backgroundMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- IMAGE 1 -->
<div class="element-animation"><img src="photo1.png" alt="photo1"></div>

<!-- IMAGE 2 -->
<div class="element-animation"><img src="photo2.png" alt="photo2"></div>

<!-- IMAGE 3 -->
<div class="element-animation"><img src="photo3.png" alt="photo3"></div>

<!-- IMAGE 4 (map) -->
<div class="element-animation">
  <a href="https://2gis.kz/semey/geo/70030076250487585" target="_blank">
    <img src="photo4.png" alt="photo4">
  </a>
</div>

<!-- IMAGE 5 -->
<div class="element-animation"><img src="photo5.png" alt="photo5"></div>

<!-- IMAGE 6 + TIMER -->
<div class="timer-wrapper element-animation" style="position:relative;">
  <img src="photo6.png" alt="photo6">
  <div class="timer-overlay">
    <div class="timer-grid">
      <div class="timer-item">
        <span class="number" id="days">00</span>
        <span class="label">Күн</span>
      </div>
      <span class="timer-divider">:</span>
      <div class="timer-item">
        <span class="number" id="hours">00</span>
        <span class="label">Сағат</span>
      </div>
      <span class="timer-divider">:</span>
      <div class="timer-item">
        <span class="number" id="minutes">00</span>
        <span class="label">Минут</span>
      </div>
      <span class="timer-divider">:</span>
      <div class="timer-item">
        <span class="number" id="seconds">00</span>
        <span class="label">Секунд</span>
      </div>
    </div>
  </div>
</div>

<!-- IMAGE 7 -->
<div class="element-animation"><img src="photo7.png" alt="photo7"></div>

<!-- FORM -->
<div class="form-wrapper">
  <div class="form-container">
    <form id="form">
      <div class="form-inner">
        <div class="title">Есіміңіз</div>

        <div class="radio-group">
          <p>Жұбыңызбен келсеңіз, есімін жазыңыз</p>
          <input type="radio" id="q1_yes" name="attendance" value="Әрине келемін" required>
          <label for="q1_yes">Әрине келемін</label><br>
          <input type="radio" id="q1_no" name="attendance" value="Өкінішке орай бара алмаймын">
          <label for="q1_no">Өкінішке орай бара алмаймын</label>
        </div>

        <div class="radio-group">
          <p>Неше адам болып келесіздер?</p>
          <div style="display:flex;align-items:center;gap:12px;justify-content:center;">
            <button type="button" id="decrease" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#000;padding:0 6px;">−</button>
            <span id="peopleCount" style="font-size:1.3rem;min-width:30px;text-align:center;color:#000;">1</span>
            <button type="button" id="increase" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#000;padding:0 6px;">+</button>
          </div>
          <input type="hidden" name="people" id="peopleHidden" value="1">
        </div>

        <textarea name="message" id="message" placeholder="Ізгі тілек қалдырсаңыз" rows="1"></textarea>

        <button type="submit" class="btn-submit">Жауапты жіберемін</button>
      </div>
    </form>
  </div>
</div>

<!-- IMAGE 8 (Instagram) -->
<div class="element-animation">
  <a href="https://www.instagram.com/toiga_shaqyrtugo/" target="_blank">
    <img src="photo8.png" alt="photo8">
  </a>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // --- Музыканы автоматты түрде ойнату ---
    const audio = document.getElementById('backgroundMusic');
    
    // Музыканы ойнатудың бірнеше әдісі
    function playAudio() {
      audio.play().then(() => {
        console.log('Музыка ойнап жатыр');
      }).catch((error) => {
        console.log('Музыка ойнату қатесі:', error);
        // Егер автоматты ойнату блокталса, пайдаланушы әрекетінен кейін ойнату
        document.addEventListener('click', function playOnClick() {
          audio.play();
          document.removeEventListener('click', playOnClick);
        }, { once: true });
        document.addEventListener('touchstart', function playOnTouch() {
          audio.play();
          document.removeEventListener('touchstart', playOnTouch);
        }, { once: true });
      });
    }

    // Бет жүктелгеннен кейін музыканы ойнату
    setTimeout(playAudio, 300);

    // Fade-in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('element-show');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.element-animation').forEach(el => observer.observe(el));

    // Timer
    function updateCountdown() {
      const end = new Date("October 17, 2026 17:00:00").getTime();
      const now = Date.now();
      let diff = end - now;
      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }
      document.getElementById('days').textContent = String(Math.floor(diff / (1000*60*60*24))).padStart(2,'0');
      document.getElementById('hours').textContent = String(Math.floor((diff % (1000*60*60*24)) / (1000*60*60))).padStart(2,'0');
      document.getElementById('minutes').textContent = String(Math.floor((diff % (1000*60*60)) / (1000*60))).padStart(2,'0');
      document.getElementById('seconds').textContent = String(Math.floor((diff % (1000*60)) / 1000)).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // People counter
    let count = 1;
    const decreaseBtn = document.getElementById('decrease');
    const increaseBtn = document.getElementById('increase');
    const countDisplay = document.getElementById('peopleCount');
    const hiddenPeople = document.getElementById('peopleHidden');

    decreaseBtn.addEventListener('click', () => {
      if (count > 1) {
        count--;
        countDisplay.textContent = count;
        hiddenPeople.value = count;
      }
    });
    increaseBtn.addEventListener('click', () => {
      count++;
      countDisplay.textContent = count;
      hiddenPeople.value = count;
    });

    // Form submit
    const form = document.getElementById('form');
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzed_5neOpvQv35LT35gF9NbpHa4Et50qFOq4bAPLDAOWr143e7PEmo0uYngnKUlqk2/exec';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const attendance = document.querySelector('[name="attendance"]:checked');
      const people = document.querySelector('[name="people"]');
      const message = document.querySelector('[name="message"]');

      const data = {
        attendance: attendance ? attendance.value : '',
        people: people ? people.value : '',
        message: message.value.trim()
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error('Submit error:', err);
      }

      if (attendance) attendance.checked = false;
      count = 1;
      countDisplay.textContent = count;
      hiddenPeople.value = count;
      message.value = '';
      alert('Жауабыңызға рахмет!');
    });

    // Autoscroll
    const SPEED_PX_PER_SEC = 100;
    const RESTART_DELAY_MS = 5000;
    let isRunning = false, resumeTimer = null, rafId = null, lastTs = 0, accum = 0;

    function safeScrollBy(step) {
      const before = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      window.scrollBy(0, step);
      let after = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      if (after === before) {
        document.documentElement.scrollTop = before + step;
        after = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        if (after === before) document.body.scrollTop = before + step;
      }
    }

    function atBottom() {
      const maxScroll = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - window.innerHeight;
      const y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      return y >= maxScroll - 1;
    }

    function loop(ts) {
      rafId = requestAnimationFrame(loop);
      if (!isRunning) { lastTs = ts; return; }
      if (!lastTs) lastTs = ts;
      const dt = ts - lastTs;
      lastTs = ts;
      accum += (SPEED_PX_PER_SEC * dt) / 1000;
      const step = Math.floor(accum);
      if (step >= 1) {
        accum -= step;
        if (atBottom()) { stopAuto(); cancelAnimationFrame(rafId); rafId = null; return; }
        safeScrollBy(step);
      }
    }

    function startAuto() { if (!isRunning) isRunning = true; }
    function stopAuto() { isRunning = false; }
    function restartAfterDelay() {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => startAuto(), RESTART_DELAY_MS);
    }

    const onInteract = () => { stopAuto(); restartAfterDelay(); };
    ['touchstart','touchmove','wheel','mousedown','keydown'].forEach(ev => 
      window.addEventListener(ev, onInteract, { passive: true })
    );

    setTimeout(() => {
      if (!rafId) rafId = requestAnimationFrame(loop);
      startAuto();
    }, 500);
  });
</script>

</body>
</html>
