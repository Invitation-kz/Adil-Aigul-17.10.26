<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Әділ & Айгүл</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:wght@100;300;400;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f5f2ef;
      font-family: 'Piazzolla', serif;
      overflow-x: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    a {
      display: block;
    }
    .content-block {
      position: relative;
      width: 100%;
    }

    /* Fade-in animation for images */
    .element-animation {
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .element-animation.element-show {
      opacity: 1;
    }

    /* Countdown timer */
    .timer-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .timer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #3F3F3F;
      text-shadow: 0 2px 10px rgba(255,255,255,0.6);
      pointer-events: none;
    }
    .countdown-container {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 5px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(2px);
      padding: 10px 20px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      pointer-events: auto;
      flex-wrap: wrap;
    }
    .countdown-item {
      text-align: center;
      min-width: 50px;
    }
    .countdown-item span:first-child {
      display: block;
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.2;
      color: #2d2d2d;
    }
    .countdown-item span:last-child {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #444;
    }
    .countdown-divider {
      font-size: 2rem;
      font-weight: 100;
      color: #555;
      padding: 0 2px;
    }

    /* Form Styles */
    .form-container {
      background: #F4F1EE;
      padding: 25px 15px;
      border-radius: 20px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }
    .form-inner .radio-group {
      text-align: left;
      margin-bottom: 15px;
    }
    .form-inner .radio-group p {
      font-weight: 400;
      margin-bottom: 6px;
      color: #1d1d1d;
      font-size: 1.1rem;
    }
    .form-inner label {
      font-weight: 300;
      margin-left: 6px;
      color: #222;
    }
    .form-inner input[type="radio"] {
      margin-right: 4px;
      accent-color: #829E64;
    }
    .people-selector {
      display: flex;
      align-items: center;
      gap: 15px;
      background: white;
      padding: 5px 15px;
      border-radius: 40px;
      width: fit-content;
      border: 1px solid #d0cbc6;
    }
    .people-selector button {
      background: none;
      border: none;
      font-size: 1.5rem;
      font-weight: 300;
      color: #2d2d2d;
      padding: 0 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .people-selector button:hover {
      transform: scale(1.2);
      color: #829E64;
    }
    .people-selector span {
      font-size: 1.4rem;
      min-width: 30px;
      text-align: center;
      font-weight: 400;
    }
    .form-inner textarea {
      width: 100%;
      border: 1px solid #d0cbc6;
      border-radius: 30px;
      padding: 12px 18px;
      font-size: 0.95rem;
      background: white;
      resize: vertical;
      min-height: 50px;
      font-family: inherit;
    }
    .form-inner textarea:focus {
      outline: none;
      border-color: #829E64;
      box-shadow: 0 0 0 3px rgba(130, 158, 100, 0.2);
    }
    .btn-submit {
      background: linear-gradient(135deg, #7D9E56, #5f7d3e);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 1px;
      width: 100%;
      transition: 0.3s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(130, 158, 100, 0.4);
    }

    /* Modal */
    .modal-custom {
      display: flex;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .modal-content-custom {
      background: #F4F1EE;
      padding: 30px 20px 40px;
      border-radius: 30px;
      text-align: center;
      max-width: 380px;
      width: 85%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal-content-custom img {
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .modal-content-custom button {
      background: #829E64;
      border: none;
      padding: 12px 40px;
      border-radius: 50px;
      color: white;
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 1px;
      transition: 0.3s;
      cursor: pointer;
    }
    .modal-content-custom button:hover {
      transform: scale(1.05);
      background: #6d8a51;
    }

    /* Sakura (cherry blossom) */
    .sakura {
      pointer-events: none;
      position: fixed;
    }

    /* Responsive */
    @media (max-width: 576px) {
      .countdown-item span:first-child {
        font-size: 1.6rem;
      }
      .countdown-divider {
        font-size: 1.4rem;
      }
      .countdown-container {
        padding: 8px 12px;
        gap: 2px;
      }
      .countdown-item {
        min-width: 35px;
      }
      .timer-overlay {
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

<!-- SCRIPTS -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // --- Intersection Observer for fade-in ---
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('element-show');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.element-animation').forEach(el => observer.observe(el));

    function updateCountdown() {
      const end = new Date("October 17, 2026 17:00:00").getTime();
      const now = Date.now();
      let diff = end - now;
      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }
      const days = Math.floor(diff / (1000*60*60*24));
      const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
      const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
      const seconds = Math.floor((diff % (1000*60)) / 1000);
      document.getElementById('days').textContent = String(days).padStart(2,'0');
      document.getElementById('hours').textContent = String(hours).padStart(2,'0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2,'0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // --- People counter ---
    let count = 1;
    const decreaseBtn = document.getElementById('decrease');
    const increaseBtn = document.getElementById('increase');
    const countDisplay = document.getElementById('peopleCount');
    const hiddenPeople = document.getElementById('peopleHidden');

    decreaseBtn.addEventListener('click', () => {
      if (count > 1) {
        count--;
        countDisplay.textContent = count;
        hiddenPeople.value = count;
      }
    });
    increaseBtn.addEventListener('click', () => {
      count++;
      countDisplay.textContent = count;
      hiddenPeople.value = count;
    });

    // --- Form submission to Google Sheets ---
    const form = document.getElementById('form');
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzed_5neOpvQv35LT35gF9NbpHa4Et50qFOq4bAPLDAOWr143e7PEmo0uYngnKUlqk2/exec';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const attendance = document.querySelector('[name="attendance"]:checked');
      const people = document.querySelector('[name="people"]');
      const message = document.querySelector('[name="message"]');

      const data = {
        attendance: attendance ? attendance.value : '',
        people: people ? people.value : '',
        message: message.value.trim()
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error('Submit error:', err);
      }

      // Reset form
      if (attendance) attendance.checked = false;
      count = 1;
      countDisplay.textContent = count;
      hiddenPeople.value = count;
      message.value = '';
      alert('Жауабыңызға рахмет!');
    });

    // --- Modal & Autoscroll + Music ---
    const modal = document.getElementById('musicModal');
    const playBtn = document.getElementById('playMusic');
    const audio = document.getElementById('backgroundMusic');

    // Autoscroll settings
    const SPEED_PX_PER_SEC = 100;
    const RESTART_DELAY_MS = 5000;
    let isRunning = false;
    let resumeTimer = null;
    let rafId = null;
    let lastTs = 0;
    let accum = 0;

    function safeScrollBy(step) {
      const before = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      window.scrollBy(0, step);
      let after = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      if (after === before) {
        document.documentElement.scrollTop = before + step;
        after = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        if (after === before) {
          document.body.scrollTop = before + step;
        }
      }
    }

    function atBottom() {
      const maxScroll = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - window.innerHeight;
      const y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      return y >= maxScroll - 1;
    }

    function loop(ts) {
      rafId = requestAnimationFrame(loop);
      if (!isRunning) { lastTs = ts; return; }
      if (!lastTs) lastTs = ts;
      const dt = ts - lastTs;
      lastTs = ts;
      accum += (SPEED_PX_PER_SEC * dt) / 1000;
      const step = Math.floor(accum);
      if (step >= 1) {
        accum -= step;
        if (atBottom()) {
          stopAuto();
          cancelAnimationFrame(rafId);
          rafId = null;
          return;
        }
        safeScrollBy(step);
      }
    }

    function startAuto() { if (!isRunning) isRunning = true; }
    function stopAuto() { isRunning = false; }
    function restartAfterDelay() {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => startAuto(), RESTART_DELAY_MS);
    }

    const onInteract = () => { stopAuto(); restartAfterDelay(); };
    window.addEventListener('touchstart', onInteract, { passive: true });
    window.addEventListener('touchmove', onInteract, { passive: true });
    window.addEventListener('wheel', onInteract, { passive: true });
    window.addEventListener('mousedown', onInteract, { passive: true });
    window.addEventListener('keydown', onInteract, { passive: true });

    function closeModal() {
      modal.style.display = 'none';
      document.body.style.overflow = '';
      // show all hidden elements
      document.querySelectorAll('.element-animation').forEach(el => el.classList.add('element-show'));
      // start autoscroll
      if (!rafId) rafId = requestAnimationFrame(loop);
      restartAfterDelay();
    }

    playBtn.addEventListener('click', () => {
      audio.play().catch(() => {});
      closeModal();
    });

    // Initially block scroll
    document.body.style.overflow = 'hidden';
  });
</script>
